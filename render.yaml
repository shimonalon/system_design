services:
  # ─────────────────────────────────────────
  # Main landing page (static site)
  # ─────────────────────────────────────────
  - type: web
    name: system-design-lab
    runtime: static
    staticPublishPath: ./public
    plan: free
    routes:
      - type: rewrite
        source: /p1
        destination: https://url-shortener-ui.onrender.com

  # ─────────────────────────────────────────
  # Project 01 — URL Shortener Frontend
  # ─────────────────────────────────────────
  - type: web
    name: url-shortener-ui
    runtime: static
    rootDir: 01-url-shortener/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free

  # ─────────────────────────────────────────
  # Project 01 — URL Shortener Backend API
  # ─────────────────────────────────────────
  - type: web
    name: url-shortener-api
    runtime: python
    rootDir: 01-url-shortener/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        sync: false   # Set manually: create free Redis at https://upstash.com
      - key: BASE_URL
        value: https://url-shortener-api.onrender.com
      - key: DEBUG
        value: "False"
      - key: CACHE_TTL
        value: "86400"
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"

databases:
  # PostgreSQL for URL Shortener
  - name: url-shortener-db
    databaseName: url_shortener
    user: url_shortener_user
    plan: free
