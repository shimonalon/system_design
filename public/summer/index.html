<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer - August 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      min-height: 100vh;
      padding: 1rem;
      -webkit-text-size-adjust: 100%;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .nav-link {
      display: inline-block;
      color: #1f2328;
      text-decoration: none;
      border: 2px solid #1f2328;
      border-radius: 8px;
      padding: 0.45rem 0.7rem;
      background: #ffffff;
      font-weight: 600;
    }

    .calendar-title {
      text-align: center;
      font-size: clamp(2.1rem, 7vw, 4.6rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      margin-bottom: 0.9rem;
    }

    .calendar {
      border: 3px solid #2c2f35;
      background: #ffffff;
    }

    .weekdays,
    .dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      direction: rtl;
    }

    .weekdays div {
      border-left: 2px solid #2c2f35;
      border-bottom: 2px solid #2c2f35;
      background: #ffe082;
      text-align: center;
      font-size: clamp(0.95rem, 2.7vw, 2rem);
      padding: 0.35rem 0.15rem;
      font-weight: 600;
    }

    .weekdays div:last-child {
      border-left: 0;
    }

    .day {
      position: relative;
      min-height: 96px;
      border-left: 2px solid #2c2f35;
      border-bottom: 2px solid #2c2f35;
      padding: 0.35rem;
      background: #ffffff;
    }

    /* RTL grid order per week: 1=Sun ... 6=Fri, 7=Sat */
    .dates .day:nth-child(7n + 6),
    .dates .day:nth-child(7n) {
      background: #eceff1;
    }

    .dates .day:nth-child(7n) {
      border-left: 0;
    }

    .dates .day:nth-last-child(-n + 7) {
      border-bottom: 0;
    }

    .day-number {
      font-size: clamp(1rem, 2.8vw, 2rem);
      line-height: 1;
      margin-bottom: 0.45rem;
      font-weight: 500;
    }

    .day-note {
      display: block;
      width: 100%;
      font-size: clamp(0.9rem, 1.8vw, 1.1rem);
      color: #374151;
      font-weight: 600;
      line-height: 1.2;
      min-height: 2rem;
      direction: rtl;
      text-align: center;
      word-break: break-word;
    }

    .day-note.is-question {
      display: table;
      width: auto;
      margin: 0 auto;
      background: #ffeb3b;
      color: #1f2328;
      font-weight: 700;
      padding: 0.08rem 0.32rem;
      border-radius: 4px;
    }

    .other-month .day-number {
      color: #a0a2a8;
      font-weight: 400;
    }

    @media (max-width: 700px) {
      .day {
        min-height: 78px;
        padding: 0.28rem;
      }

      .day-note {
        font-size: 0.8rem;
        min-height: 1.55rem;
      }

      .day-number {
        margin-bottom: 0.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="calendar-title">AUGUST 2026</h1>

    <div class="calendar" aria-label="August 2026 calendar right-to-left">
      <div class="weekdays" aria-hidden="true">
        <div>ראשון</div>
        <div>שני</div>
        <div>שלישי</div>
        <div>רביעי</div>
        <div>חמישי</div>
        <div>שישי</div>
        <div>שבת</div>
      </div>

      <div class="dates">

        <div class="day"><div class="day-number">2</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">3</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">4</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">5</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">6</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">7</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">8</div><div class="day-note"></div></div>

        <div class="day"><div class="day-number">9</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">10</div><div class="day-note">סבתא רוחמה</div></div>
        <div class="day"><div class="day-number">11</div><div class="day-note">סבתא רוחמה</div></div>
        <div class="day"><div class="day-number">12</div><div class="day-note">Abuela Ester</div></div>
        <div class="day"><div class="day-number">13</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">14</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">15</div><div class="day-note"></div></div>

        <div class="day"><div class="day-number">16</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">17</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">18</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">19</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">20</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">21</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">22</div><div class="day-note"></div></div>

        <div class="day"><div class="day-number">23</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">24</div><div class="day-note">Betu</div></div>
        <div class="day"><div class="day-number">25</div><div class="day-note">Betu</div></div>
        <div class="day"><div class="day-number">26</div><div class="day-note">Betu</div></div>
        <div class="day"><div class="day-number">27</div><div class="day-note">Betu</div></div>
        <div class="day"><div class="day-number">28</div><div class="day-note"></div></div>
        <div class="day"><div class="day-number">29</div><div class="day-note"></div></div>

        <div class="day"><div class="day-number">30</div><div class="day-note">?</div></div>
        <div class="day"><div class="day-number">31</div><div class="day-note">Betu</div></div>
        <div class="day other-month"><div class="day-number">1</div><div class="day-note"></div></div>
        <div class="day other-month"><div class="day-number">2</div><div class="day-note"></div></div>
        <div class="day other-month"><div class="day-number">3</div><div class="day-note"></div></div>
        <div class="day other-month"><div class="day-number">4</div><div class="day-note"></div></div>
        <div class="day other-month"><div class="day-number">5</div><div class="day-note"></div></div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.day-note').forEach((note) => {
      if (note.textContent.trim() === '?') {
        note.classList.add('is-question');
      }
    });
  </script>
</body>
</html>
